name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (clean clone, as on a work machine)
        run: pnpm install --frozen-lockfile
      - name: Doctor
        run: pnpm doctor
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: node-pty and node:sqlite inside Electron
        run: pnpm smoke
      - name: App launches (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/launch-check.cjs
      - name: App launches (Windows, macOS)
        if: runner.os != 'Linux'
        run: node scripts/launch-check.cjs
