<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skein</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Interactive mockup. Panes are tab groups; a thread tab shows as chat or as its terminal.
     Jump to a state with ?scene=home|new|single|grid|tmux|detect|recent|zoom|slash|palette|cmdline|paste|approval|machines|keys|model|side|docked|edit|vim|ticks|tabs|settings
     and optionally &mode=terminal|chat (force every thread) &theme=dark|light &side=grouped|recent &vim=on|off -->
<div id="app">
  <aside id="side"></aside>
  <main id="main">
    <div id="work"></div>
    <div id="status"></div>
  </main>
</div>
<script src="platform.js"></script>
<script src="icons.js"></script>
<script src="data.js"></script>
<section id="context-usage" popover aria-label="Context usage"></section>
<script src="view-terminal.js"></script>
<script src="view-chat.js"></script>
<script src="view-tools.js"></script>
<script src="annot.js"></script>
<script src="app.js"></script>
<script src="keys.js"></script>
<script>App.boot();</script>
</body>
</html>
